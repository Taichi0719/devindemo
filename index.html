<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Web Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
        }
        
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 1.5rem;
        }
        
        .settings-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .settings-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }
        
        .message.user {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
        }
        
        .message.assistant {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #333;
        }
        
        .input-area {
            padding: 1rem;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 0.5rem;
        }
        
        .input-area input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        
        .input-area button {
            padding: 0.75rem 1.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        
        .input-area button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        
        .input-area button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 400px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .modal-header h2 {
            margin: 0;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            font-size: 1rem;
        }
        
        .form-group small {
            color: #6c757d;
            font-size: 0.875rem;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
        }
        
        .error-message {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 0.75rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
        
        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #6c757d;
        }
        
        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function ChatApp() {
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [apiKey, setApiKey] = useState('');
            const [tempApiKey, setTempApiKey] = useState('');
            const [error, setError] = useState('');
            const messagesEndRef = useRef(null);

            useEffect(() => {
                const savedApiKey = localStorage.getItem('openai_api_key');
                if (savedApiKey) {
                    setApiKey(savedApiKey);
                }
            }, []);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const saveApiKey = () => {
                if (!tempApiKey.trim()) {
                    setError('APIキーを入力してください');
                    return;
                }
                
                if (!tempApiKey.startsWith('sk-')) {
                    setError('有効なOpenAI APIキーを入力してください（sk-で始まる必要があります）');
                    return;
                }

                localStorage.setItem('openai_api_key', tempApiKey);
                setApiKey(tempApiKey);
                setShowSettings(false);
                setError('');
                setTempApiKey('');
            };

            const sendMessage = async () => {
                if (!inputValue.trim()) return;
                
                if (!apiKey) {
                    setError('APIキーが設定されていません。設定画面でAPIキーを入力してください。');
                    setShowSettings(true);
                    return;
                }

                const userMessage = { role: 'user', content: inputValue };
                setMessages(prev => [...prev, userMessage]);
                setInputValue('');
                setIsLoading(true);
                setError('');

                try {
                    const response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: [...messages, userMessage],
                            max_tokens: 1000,
                            temperature: 0.7
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    const assistantMessage = {
                        role: 'assistant',
                        content: data.choices[0].message.content
                    };

                    setMessages(prev => [...prev, assistantMessage]);
                } catch (error) {
                    console.error('Error:', error);
                    setError(`エラーが発生しました: ${error.message}`);
                    
                    if (error.message.includes('401') || error.message.includes('Unauthorized')) {
                        setError('APIキーが無効です。設定画面で正しいAPIキーを入力してください。');
                        setShowSettings(true);
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const openSettings = () => {
                setTempApiKey(apiKey);
                setShowSettings(true);
                setError('');
            };

            const closeSettings = () => {
                setShowSettings(false);
                setTempApiKey('');
                setError('');
            };

            return (
                <div className="app">
                    <div className="header">
                        <h1>ChatGPT Web Demo</h1>
                        <button className="settings-btn" onClick={openSettings} title="設定">
                            ⚙️
                        </button>
                    </div>

                    <div className="chat-container">
                        <div className="messages">
                            {messages.length === 0 && (
                                <div style={{ textAlign: 'center', color: '#6c757d', marginTop: '2rem' }}>
                                    <p>ChatGPTとの会話を始めましょう！</p>
                                    <p>まず設定画面でAPIキーを入力してください。</p>
                                </div>
                            )}
                            
                            {messages.map((message, index) => (
                                <div key={index} className={`message ${message.role}`}>
                                    {message.content}
                                </div>
                            ))}
                            
                            {isLoading && (
                                <div className="loading">
                                    <div className="spinner"></div>
                                    <span>ChatGPTが回答を生成中...</span>
                                </div>
                            )}
                            
                            <div ref={messagesEndRef} />
                        </div>

                        {error && (
                            <div className="error-message">
                                {error}
                            </div>
                        )}

                        <div className="input-area">
                            <input
                                type="text"
                                value={inputValue}
                                onChange={(e) => setInputValue(e.target.value)}
                                onKeyPress={handleKeyPress}
                                placeholder="メッセージを入力してください..."
                                disabled={isLoading}
                            />
                            <button onClick={sendMessage} disabled={isLoading || !inputValue.trim()}>
                                送信
                            </button>
                        </div>
                    </div>

                    {showSettings && (
                        <div className="modal">
                            <div className="modal-content">
                                <div className="modal-header">
                                    <h2>設定</h2>
                                    <button className="close-btn" onClick={closeSettings}>×</button>
                                </div>
                                
                                {error && (
                                    <div className="error-message">
                                        {error}
                                    </div>
                                )}
                                
                                <div className="form-group">
                                    <label htmlFor="apiKey">OpenAI API キー</label>
                                    <input
                                        type="password"
                                        id="apiKey"
                                        value={tempApiKey}
                                        onChange={(e) => setTempApiKey(e.target.value)}
                                        placeholder="sk-..."
                                    />
                                    <small>
                                        APIキーはブラウザのローカルストレージに保存され、外部に送信されることはありません。
                                        <br />
                                        <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">
                                            OpenAI APIキーを取得
                                        </a>
                                    </small>
                                </div>
                                
                                <button className="btn-primary" onClick={saveApiKey}>
                                    保存
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<ChatApp />, document.getElementById('root'));
    </script>
</body>
</html>
