<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユースフルGPT</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1E88E5 0%, #00BCD4 100%);
            height: 100vh;
        }
        
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        
        .header {
            background: linear-gradient(135deg, #1E88E5 0%, #00BCD4 100%);
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(30, 136, 229, 0.3);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo {
            height: 2rem;
            width: auto;
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin: 0;
        }
        
        .settings-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }
        
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1E88E5 0%, #00BCD4 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.3);
        }
        
        .message.assistant {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(248, 249, 250, 0.95) 0%, rgba(255, 255, 255, 0.95) 100%);
            color: #333;
            border: 1px solid rgba(30, 136, 229, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .input-area {
            padding: 1rem;
            border-top: 1px solid rgba(30, 136, 229, 0.2);
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.1) 0%, rgba(0, 188, 212, 0.1) 100%);
            display: flex;
            gap: 0.5rem;
        }
        
        .input-area input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid rgba(30, 136, 229, 0.3);
            border-radius: 0.5rem;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        
        .input-area input:focus {
            outline: none;
            border-color: #1E88E5;
            box-shadow: 0 0 0 0.2rem rgba(30, 136, 229, 0.25);
            background: white;
        }
        
        .input-area button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #1E88E5 0%, #00BCD4 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.3);
        }
        
        .input-area button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.4);
        }
        
        .input-area button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.9) 100%);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(30, 136, 229, 0.3);
            border: 1px solid rgba(30, 136, 229, 0.2);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .modal-header h2 {
            margin: 0;
            color: #1E88E5;
            background: linear-gradient(135deg, #1E88E5 0%, #00BCD4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid rgba(30, 136, 229, 0.3);
            border-radius: 0.5rem;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1E88E5;
            box-shadow: 0 0 0 0.2rem rgba(30, 136, 229, 0.25);
            background: white;
        }
        
        .form-group small {
            color: #6c757d;
            font-size: 0.875rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1E88E5 0%, #00BCD4 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.3);
            font-weight: 600;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.4);
        }
        
        .error-message {
            color: #dc3545;
            background: linear-gradient(135deg, rgba(248, 215, 218, 0.9) 0%, rgba(245, 198, 203, 0.9) 100%);
            border: 1px solid #f5c6cb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(114, 28, 36, 0.2);
        }
        
        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #1E88E5;
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.05) 0%, rgba(0, 188, 212, 0.05) 100%);
            border-radius: 0.5rem;
            padding: 1rem;
            margin: 1rem;
        }
        
        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(30, 136, 229, 0.2);
            border-top: 2px solid #1E88E5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .file-drop-area {
            border: 2px dashed rgba(30, 136, 229, 0.4);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin: 1rem;
            text-align: center;
            color: #1E88E5;
            transition: all 0.3s ease;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.05) 0%, rgba(0, 188, 212, 0.05) 100%);
        }
        
        .file-drop-area.drag-over {
            border-color: #00BCD4;
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.15) 0%, rgba(0, 188, 212, 0.15) 100%);
            color: #00BCD4;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.3);
        }
        
        .file-drop-area:hover {
            border-color: #1E88E5;
            color: #1E88E5;
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.1) 0%, rgba(0, 188, 212, 0.1) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.2);
        }
        
        .attached-files {
            padding: 0 1rem;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            margin: 0.25rem 0;
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.08) 0%, rgba(0, 188, 212, 0.08) 100%);
            border-radius: 0.5rem;
            border: 1px solid rgba(30, 136, 229, 0.2);
            transition: all 0.3s ease;
        }
        
        .file-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.15);
        }
        
        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        
        .file-name {
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .file-size {
            font-size: 0.8rem;
            color: #6c757d;
        }
        
        .file-remove {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(238, 90, 82, 0.3);
        }
        
        .file-remove:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(238, 90, 82, 0.4);
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function ChatApp() {
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [apiKey, setApiKey] = useState('');
            const [tempApiKey, setTempApiKey] = useState('');
            const [systemPrompt, setSystemPrompt] = useState('');
            const [tempSystemPrompt, setTempSystemPrompt] = useState('');
            const [error, setError] = useState('');
            const [attachedFiles, setAttachedFiles] = useState([]);
            const [isDragOver, setIsDragOver] = useState(false);
            const messagesEndRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const savedApiKey = localStorage.getItem('openai_api_key');
                if (savedApiKey) {
                    setApiKey(savedApiKey);
                }
                
                const savedSystemPrompt = localStorage.getItem('system_prompt');
                if (savedSystemPrompt) {
                    setSystemPrompt(savedSystemPrompt);
                }
            }, []);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const saveSettings = () => {
                if (!tempApiKey.trim()) {
                    setError('APIキーを入力してください');
                    return;
                }
                
                if (!tempApiKey.startsWith('sk-')) {
                    setError('有効なOpenAI APIキーを入力してください（sk-で始まる必要があります）');
                    return;
                }

                localStorage.setItem('openai_api_key', tempApiKey);
                localStorage.setItem('system_prompt', tempSystemPrompt);
                setApiKey(tempApiKey);
                setSystemPrompt(tempSystemPrompt);
                setShowSettings(false);
                setError('');
                setTempApiKey('');
                setTempSystemPrompt('');
            };

            const sendMessage = async () => {
                if (!inputValue.trim() && attachedFiles.length === 0) return;
                
                if (!apiKey) {
                    setError('APIキーが設定されていません。設定画面でAPIキーを入力してください。');
                    setShowSettings(true);
                    return;
                }

                let messageContent = inputValue;
                
                // ファイルが添付されている場合の処理
                if (attachedFiles.length > 0) {
                    const fileContents = [];
                    
                    for (const file of attachedFiles) {
                        if (file.contentType === 'text' && file.content) {
                            // テキストファイルの場合は内容を含める
                            fileContents.push(`--- ${file.name} ---\n${file.content}\n--- ${file.name} 終了 ---`);
                        } else {
                            // その他のファイルは説明のみ
                            fileContents.push(`[添付ファイル: ${file.name} (${file.size}) - ${file.contentType}]`);
                        }
                    }
                    
                    const fileSection = fileContents.join('\n\n');
                    messageContent = inputValue ? `${inputValue}\n\n${fileSection}` : fileSection;
                }

                const userMessage = { 
                    role: 'user', 
                    content: messageContent,
                    attachments: attachedFiles.length > 0 ? attachedFiles : undefined
                };
                
                setMessages(prev => [...prev, userMessage]);
                setInputValue('');
                setAttachedFiles([]);
                setIsLoading(true);
                setError('');

                try {
                    const messagesToSend = [...messages, userMessage];
                    
                    // システムプロンプトが設定されている場合は先頭に追加
                    if (systemPrompt.trim()) {
                        messagesToSend.unshift({
                            role: 'system',
                            content: systemPrompt
                        });
                    }
                    
                    const response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: messagesToSend,
                            max_tokens: 1000,
                            temperature: 0.7
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    const assistantMessage = {
                        role: 'assistant',
                        content: data.choices[0].message.content
                    };

                    setMessages(prev => [...prev, assistantMessage]);
                } catch (error) {
                    console.error('Error:', error);
                    setError(`エラーが発生しました: ${error.message}`);
                    
                    if (error.message.includes('401') || error.message.includes('Unauthorized')) {
                        setError('APIキーが無効です。設定画面で正しいAPIキーを入力してください。');
                        setShowSettings(true);
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const openSettings = () => {
                setTempApiKey(apiKey);
                setTempSystemPrompt(systemPrompt);
                setShowSettings(true);
                setError('');
            };

            const closeSettings = () => {
                setShowSettings(false);
                setTempApiKey('');
                setTempSystemPrompt('');
                setError('');
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragOver(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setIsDragOver(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                
                const files = Array.from(e.dataTransfer.files);
                handleFiles(files);
            };

            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files);
                handleFiles(files);
                e.target.value = '';
            };

            const handleFiles = async (files) => {
                const validFiles = files.filter(file => {
                    const maxSize = 10 * 1024 * 1024; // 10MB
                    if (file.size > maxSize) {
                        setError(`ファイル "${file.name}" は10MBを超えています。`);
                        return false;
                    }
                    return true;
                });

                const processedFiles = [];
                
                for (const file of validFiles) {
                    try {
                        let content = null;
                        let contentType = 'unknown';
                        
                        // テキストファイルの場合は内容を読み取り
                        if (file.type.startsWith('text/') || 
                            file.name.endsWith('.txt') || 
                            file.name.endsWith('.md') || 
                            file.name.endsWith('.json') || 
                            file.name.endsWith('.csv') ||
                            file.name.endsWith('.js') ||
                            file.name.endsWith('.html') ||
                            file.name.endsWith('.css')) {
                            content = await readFileAsText(file);
                            contentType = 'text';
                        }
                        // 画像ファイルの場合
                        else if (file.type.startsWith('image/')) {
                            contentType = 'image';
                            content = `[画像ファイル: ${file.name}]`;
                        }
                        // その他のファイル
                        else {
                            contentType = 'binary';
                            content = `[ファイル: ${file.name} (${file.type || '不明な形式'})]`;
                        }

                        processedFiles.push({
                            id: Date.now() + Math.random(),
                            file: file,
                            name: file.name,
                            size: formatFileSize(file.size),
                            type: file.type,
                            content: content,
                            contentType: contentType
                        });
                    } catch (error) {
                        console.error(`ファイル "${file.name}" の読み取りに失敗:`, error);
                        setError(`ファイル "${file.name}" の読み取りに失敗しました。`);
                    }
                }

                setAttachedFiles(prev => [...prev, ...processedFiles]);
            };

            const formatFileSize = (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };

            const removeFile = (fileId) => {
                setAttachedFiles(prev => prev.filter(f => f.id !== fileId));
            };

            const readFileAsBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            const readFileAsText = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsText(file, 'UTF-8');
                });
            };

            return (
                <div className="app">
                    <div className="header">
                        <div className="header-left">
                            <img src="logo.png" alt="Logo" className="logo" />
                            <h1>ユースフルGPT</h1>
                        </div>
                        <button className="settings-btn" onClick={openSettings} title="設定">
                            ⚙️
                        </button>
                    </div>

                    <div className="chat-container">
                        <div className="messages">
                            {messages.length === 0 && (
                                <div style={{ textAlign: 'center', color: '#6c757d', marginTop: '2rem' }}>
                                    <p>ChatGPTとの会話を始めましょう！</p>
                                    <p>まず設定画面でAPIキーを入力してください。</p>
                                    <p>ファイルをドラッグ&ドロップで添付することもできます。</p>
                                </div>
                            )}
                            
                            {messages.map((message, index) => (
                                <div key={index} className={`message ${message.role}`}>
                                    <div style={{ whiteSpace: 'pre-wrap' }}>{message.content}</div>
                                    {message.attachments && message.attachments.length > 0 && (
                                        <div style={{ marginTop: '0.5rem', fontSize: '0.8rem', opacity: 0.8 }}>
                                            📎 {message.attachments.length}個のファイルが添付されました
                                        </div>
                                    )}
                                </div>
                            ))}
                            
                            {isLoading && (
                                <div className="loading">
                                    <div className="spinner"></div>
                                    <span>ChatGPTが回答を生成中...</span>
                                </div>
                            )}
                            
                            <div ref={messagesEndRef} />
                        </div>

                        {error && (
                            <div className="error-message">
                                {error}
                            </div>
                        )}

                        <div 
                            className={`file-drop-area ${isDragOver ? 'drag-over' : ''}`}
                            onDragOver={handleDragOver}
                            onDragLeave={handleDragLeave}
                            onDrop={handleDrop}
                            onClick={() => fileInputRef.current?.click()}
                        >
                            <div>📎 ファイルをドラッグ&ドロップまたはクリックして添付</div>
                            <div style={{ fontSize: '0.8rem', marginTop: '0.5rem' }}>
                                最大10MB、複数ファイル対応
                            </div>
                        </div>

                        <input
                            ref={fileInputRef}
                            type="file"
                            multiple
                            className="hidden"
                            onChange={handleFileSelect}
                        />

                        {attachedFiles.length > 0 && (
                            <div className="attached-files">
                                <div style={{ fontSize: '0.9rem', fontWeight: 'bold', marginBottom: '0.5rem' }}>
                                    添付ファイル ({attachedFiles.length})
                                </div>
                                {attachedFiles.map(file => (
                                    <div key={file.id} className="file-item">
                                        <div className="file-info">
                                            <div className="file-name">{file.name}</div>
                                            <div className="file-size">{file.size}</div>
                                        </div>
                                        <button 
                                            className="file-remove"
                                            onClick={() => removeFile(file.id)}
                                            title="ファイルを削除"
                                        >
                                            ×
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="input-area">
                            <input
                                type="text"
                                value={inputValue}
                                onChange={(e) => setInputValue(e.target.value)}
                                onKeyPress={handleKeyPress}
                                placeholder="メッセージを入力してください..."
                                disabled={isLoading}
                            />
                            <button onClick={sendMessage} disabled={isLoading || (!inputValue.trim() && attachedFiles.length === 0)}>
                                送信
                            </button>
                        </div>
                    </div>

                    {showSettings && (
                        <div className="modal">
                            <div className="modal-content">
                                <div className="modal-header">
                                    <h2>設定</h2>
                                    <button className="close-btn" onClick={closeSettings}>×</button>
                                </div>
                                
                                {error && (
                                    <div className="error-message">
                                        {error}
                                    </div>
                                )}
                                
                                <div className="form-group">
                                    <label htmlFor="apiKey">OpenAI API キー</label>
                                    <input
                                        type="password"
                                        id="apiKey"
                                        value={tempApiKey}
                                        onChange={(e) => setTempApiKey(e.target.value)}
                                        placeholder="sk-..."
                                    />
                                    <small>
                                        APIキーはブラウザのローカルストレージに保存され、外部に送信されることはありません。
                                        <br />
                                        <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">
                                            OpenAI APIキーを取得
                                        </a>
                                    </small>
                                </div>
                                
                                <div className="form-group">
                                    <label htmlFor="systemPrompt">システムプロンプト（任意）</label>
                                    <textarea
                                        id="systemPrompt"
                                        value={tempSystemPrompt}
                                        onChange={(e) => setTempSystemPrompt(e.target.value)}
                                        placeholder="ChatGPTの動作を指定するプロンプトを入力してください..."
                                        rows="4"
                                        style={{
                                            width: '100%',
                                            padding: '0.75rem',
                                            border: '1px solid #dee2e6',
                                            borderRadius: '0.25rem',
                                            fontSize: '1rem',
                                            resize: 'vertical',
                                            fontFamily: 'inherit'
                                        }}
                                    />
                                    <small>
                                        システムプロンプトはChatGPTの役割や回答スタイルを指定するために使用されます。
                                        例：「あなたは親切なアシスタントです。」
                                    </small>
                                </div>
                                
                                <button className="btn-primary" onClick={saveSettings}>
                                    保存
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<ChatApp />, document.getElementById('root'));
    </script>
</body>
</html>
